<header class="h-14 bg-white border-b border-[#E2E8F0] px-5 flex items-center justify-between sticky top-0 z-20 select-none">
  <!-- Informacion de contexto de la estacion -->
  <div class="flex items-center gap-3">
    <div class="flex items-center gap-2 text-xs text-slate-500 font-medium">
      <span class="text-slate-900 font-semibold">Mistik Tours & Travel</span>
      <span class="text-slate-300">/</span>
      <span class="text-slate-600">Gestion Operativa</span>
    </div>

    <!-- Indicador de sede corporativa -->
    <span class="hidden sm:inline-flex items-center px-2 py-0.5 rounded-[4px] text-[11px] font-medium bg-slate-50 text-slate-600 border border-slate-200">
      Sede Trujillo &bull; Central
    </span>
  </div>

  <!-- Area de usuario y estacion de trabajo -->
  <div class="flex items-center gap-4">
    @if (authService.currentUser(); as user) {
      <div class="flex items-center gap-3">
        <!-- Chip del operador -->
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-[6px] bg-slate-100 text-slate-700 font-bold flex items-center justify-center text-xs border border-slate-200">
            {{ userInitials() }}
          </div>

          <div class="hidden sm:block text-left leading-tight">
            <div class="font-semibold text-slate-900 text-xs truncate max-w-[170px]">
              {{ user.name }}
            </div>
            <div class="mt-0.5">
              <span class="text-[10px] font-semibold px-1.5 py-0.2 rounded border {{ roleBadgeClass() }}">
                {{ roleDisplay() }}
              </span>
            </div>
          </div>
        </div>

        <!-- Boton de cierre de estacion (estilo secundario neutral ERP) -->
        <button
          (click)="logout()"
          class="h-8 px-2.5 rounded-[6px] border border-slate-200 bg-white hover:bg-slate-50 text-slate-600 hover:text-[#DC2626] hover:border-rose-200 transition text-xs font-semibold flex items-center gap-1.5"
          title="Cerrar estacion de trabajo"
        >
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
          </svg>
          <span class="hidden md:inline">Salir</span>
        </button>
      </div>
    }
  </div>
</header>
