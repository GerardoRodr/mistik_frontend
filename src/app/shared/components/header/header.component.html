<header class="h-16 bg-white border-b border-slate-200 px-6 flex items-center justify-between shadow-xs sticky top-0 z-20">
  <!-- Titulo y contexto de operacion -->
  <div class="flex items-center gap-3">
    <div class="flex items-center gap-2 text-sm text-slate-500">
      <span class="font-medium text-slate-800">Mistik Tours & Travel</span>
      <span>/</span>
      <span class="text-sky-600 font-semibold">Sistema Web SPA</span>
    </div>
    <span class="hidden md:inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-slate-100 text-slate-600 border border-slate-200">
      v1.0 (30% T1)
    </span>
  </div>

  <!-- Area de usuario y acciones -->
  <div class="flex items-center gap-4">
    <!-- Informacion del colaborador -->
    @if (authService.currentUser(); as user) {
      <div class="flex items-center gap-3 pl-3 border-l border-slate-200">
        <!-- Avatar con iniciales -->
        <div class="w-9 h-9 rounded-full bg-sky-100 text-sky-700 font-bold flex items-center justify-center text-sm border border-sky-200 shadow-2xs">
          {{ userInitials() }}
        </div>

        <!-- Nombre y rol -->
        <div class="hidden sm:block text-left leading-tight">
          <div class="font-semibold text-slate-800 text-sm truncate max-w-[160px]">{{ user.name }}</div>
          <div class="flex items-center gap-1.5 mt-0.5">
            <span class="text-[11px] font-bold px-1.5 py-0.2 rounded border {{ roleBadgeClass() }}">
              {{ user.role }}
            </span>
          </div>
        </div>

        <!-- Boton de cierre de sesion -->
        <button
          (click)="logout()"
          class="ml-2 text-slate-400 hover:text-rose-600 p-2 rounded-lg hover:bg-rose-50 transition"
          title="Cerrar sesion"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
          </svg>
        </button>
      </div>
    }
  </div>
</header>
